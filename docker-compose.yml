services:
  sms-issuer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server-info
    ports:
      - "8080:8080"
    volumes:
      - ./.secrets:/secrets
    restart: unless-stopped
    networks:
      - app_network
    depends_on: [postgres]

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: irma
      POSTGRES_PASSWORD: irma
      POSTGRES_DB: irma
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data: